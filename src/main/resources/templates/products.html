<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista produktów</title>
</head>
<body>
<h1>Lista produktów</h1>

<p th:if="${#lists.isEmpty(products)}">Brak elementów na liście</p>

<table th:unless="${#lists.isEmpty(products)}" border="1">
    <tr>
        <th>Id</th>
        <th>Nazwa</th>
        <th>Kategoria</th>
        <th>Sezon</th>
        <th>Rozmiar</th>
        <th>Data dodania</th>
        <th>Cena</th>
        <th>Dostępny</th>
    </tr>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.category}"></td>
        <td th:text="${product.season}"></td>
        <td th:text="${product.size}"></td>
        <td th:text="${#temporals.format(product.addedDate, 'dd.MM.yyyy')}"></td>
        <td th:text="${#numbers.formatDecimal(product.price, 1, 2, 'COMMA')} + ' zł'"></td>
        <td th:text="${product.available} ? 'Tak' : 'Nie'"></td>
    </tr>
</table>

<a th:href="@{/}">Powrót</a>
</body>
</html>
